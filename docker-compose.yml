version: '3.8'

services:
  oncehuman:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/wickedyoda/oncehuman_gameserver:latest
    container_name: oncehuman
    restart: unless-stopped
    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"
      - "27016:27016/tcp"
      - "27016:27016/udp"
      - "27017:27017/tcp"
    volumes:
      - /root/once-human-saves:/home/oncehuman/server/OnceHuman/Saved
      - /root/once-human-config/GameUserSettings.ini:/home/oncehuman/server/OnceHuman/Saved/Config/WindowsServer/GameUserSettings.ini:ro
    environment:
      - SERVER_NAME=${SERVER_NAME:-My Once Human Server}
      - MAX_PLAYERS=${MAX_PLAYERS:-16}
      - SERVER_PASSWORD=${SERVER_PASSWORD:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - PVE_ENABLED=${PVE_ENABLED:-True}
      - DAY_LENGTH=${DAY_LENGTH:-60}
      - NIGHT_LENGTH=${NIGHT_LENGTH:-300}
      - XP_MULTIPLIER=${XP_MULTIPLIER:-1.0}
      - RESOURCE_MULTIPLIER=${RESOURCE_MULTIPLIER:-1.0}
      - DROP_MULTIPLIER=${DROP_MULTIPLIER:-1.0}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /home/oncehuman/.wine