name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine next version
        id: version
        run: |
          latest_tag=$(git tag -l '1.*' | sort -V | tail -n 1 || true)
          if [ -z "$latest_tag" ]; then
            next="1.01"
          else
            minor=$(echo "$latest_tag" | cut -d. -f2)
            next=$(printf "1.%02d" $((10#$minor + 1)))
          fi
          echo "Next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Compute image name
        id: meta
        run: |
          # Convert repo name to lowercase for GHCR compatibility
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr 'A-Z' 'a-z')
          echo "image_name=ghcr.io/${{ github.repository_owner }}/${REPO_NAME}" >> "$GITHUB_OUTPUT"
          echo "Image name: ghcr.io/${{ github.repository_owner }}/${REPO_NAME}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.image_name }}:${{ steps.version.outputs.version }}